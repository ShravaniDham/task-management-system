{% extends "base.html" %}
{% block title %}Edit Task{% endblock %}
{% block content %}
<section class="panel">
  <h2>Edit task #{{ task.id }}</h2>
  <form method="post" class="task-form">
    <label>Title *
      <input type="text" name="title" maxlength="100" value="{{ task.title }}" required>
    </label>
    <label>Description
      <textarea name="description" rows="3">{{ task.description }}</textarea>
    </label>
    <label>Status
      <select name="status">
        {% for s in statuses %}<option {% if s == task.status %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </label>
    <label>Priority
      <select name="priority">
        {% for p in priorities %}<option {% if p == task.priority %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    </label>
    <div>
      <button type="submit" class="btn primary">Save Changes</button>
      <a class="btn" href="{{ url_for('tasks.index') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
